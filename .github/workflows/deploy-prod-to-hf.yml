name: Redeploy prod to Hugging Face (manual)

# Manual escape hatch. Normal deploys happen automatically on every push to
# main (sync-to-hf.yml); run this one from the Actions tab to force-push the
# ref you pick in the "Run workflow" dropdown (defaults to main) without a
# new commit -- e.g. after rotating Space secrets, retrying a failed sync
# run, or rolling prod back to an older ref.
on:
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Space (ai-tutor-chatbot)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: git push --force "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/towardsai-tutors/ai-tutor-chatbot" HEAD:main
