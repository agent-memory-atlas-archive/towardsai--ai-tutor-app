name: Deploy prod to Hugging Face (ai-tutor-chatbot)

# Continuous deployment straight to the PUBLIC prod Space on every push to
# main. The private dev Space (ai-tutor) was retired in 2026-08 to free a
# public Space slot, so there is no staging hop anymore: merging to main IS
# deploying. Keep main releasable, and remember anything committed here
# becomes world-readable on the next push (see the eval-data gotcha in
# AGENTS.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/scraping_scripts/**'
      - 'README.md'
      - 'docs/**'
      - '**.md'

  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Space (ai-tutor-chatbot)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: git push --force "https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/towardsai-tutors/ai-tutor-chatbot" HEAD:main
